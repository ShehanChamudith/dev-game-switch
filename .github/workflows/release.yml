# Publishes a GitHub Release with DevGameSwitch.exe whenever a version tag is pushed:
#   git tag v1.0.0
#   git push origin v1.0.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Build from source so the attached exe always matches the tagged code.
      - name: Build
        shell: cmd
        run: app\build.cmd

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" app/DevGameSwitch.exe
          --title "$GITHUB_REF_NAME"
          --generate-notes
